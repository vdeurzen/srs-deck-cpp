id: hft-interview
name: HFT Interview Prep
description: The implement-it and design questions low-latency C++ interviews ask — rebuild std components (vector, smart pointers, function, optional), write the SPSC queue, order book, LRU and rate limiter, and the C++ trivia round — each decision as its own Card.
language: cpp
format: 1
relations: # cards here may require the essentials Decks, cpp-basics/<id>, cpp-core/<id>, algo-basics/<id> and algo-systems/<id>
  - deck: cpp-basics
    role: builds-on
  - deck: cpp-core
    role: builds-on
  - deck: algo-basics
    role: builds-on
  - deck: algo-systems
    role: builds-on
  - deck: cpp-essentials
    role: builds-on
  - deck: interview-essentials
    role: builds-on
defaults:
  compile:
    compiler: g142 # GCC 14.2 on Compiler Explorer
    std: c++23
    flags: [-Wall, -Wextra]
