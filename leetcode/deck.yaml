id: leetcode
name: LeetCode Patterns
description: Interview-speed templates for the LeetCode patterns — recognise the pattern from the problem statement, write its template from memory, trace it, and avoid the C++ traps that cost a submission.
language: cpp
format: 1
relations: # cards here may require the essentials Decks, cpp-basics/<id>, cpp-core/<id>, algo-basics/<id> and algo-systems/<id>
  - deck: cpp-basics
    role: builds-on
  - deck: cpp-core
    role: builds-on
  - deck: algo-basics
    role: builds-on
  - deck: algo-systems
    role: builds-on
  - deck: cpp-essentials
    role: builds-on
  - deck: interview-essentials
    role: builds-on
defaults:
  compile:
    compiler: g142 # GCC 14.2 on Compiler Explorer
    std: c++23
    flags: [-Wall, -Wextra]
