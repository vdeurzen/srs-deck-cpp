id: cpp-basics
name: C++ Basics
description: A from-the-ground-up crash course on C++ foundations — types, pointers and references, const, functions, classes, object lifetime, templates, containers, algorithms, errors, linkage and undefined behaviour.
language: cpp
format: 1
defaults:
  compile:
    compiler: g142 # GCC 14.2 on Compiler Explorer
    std: c++23
    flags: [-Wall, -Wextra]
